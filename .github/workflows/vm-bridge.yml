name: VM Bridge
on:
  push:
    branches: ['arena/**']
    paths: ['bridge/cmd.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exec:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Executer la commande recue
        run: |
          echo "===== VM-BRIDGE RESULT ====="
          echo "# host: $(hostname)"
          echo "# date: $(date -u +%FT%TZ)"
          bash bridge/cmd.txt 2>&1 || true
          echo "===== FIN ====="
      - name: Publier le resultat
        if: always()
        run: |
          git config user.name "vm-bridge"
          git config user.email "vm-bridge@users.noreply.github.com"
          git add -f bridge/out.txt
          git commit -m "bridge: resultat" || exit 0
          git push origin HEAD
